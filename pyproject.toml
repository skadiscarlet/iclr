[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egsi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pyarrow>=17,<24",
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "respx>=0.21,<1",
]

[project.scripts]
egsi = "egsi.cli:app"
sbs = "sbs.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/egsi", "src/sbs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
